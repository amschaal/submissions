server {

    listen 80;
    root /var/www/html/;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    index index.html;

    charset utf-8;

    location /server {
        proxy_pass http://0.0.0.0:8000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host $host;
        proxy_redirect off;
        rewrite ^/server(/.*)$ $1 break;
    }
#    location /server {
#        proxy_pass http://web;
#    }
    # Never serve a stale SPA shell, so a refresh loads the latest build. (Hashed
    # js/css are immutable and may still be cached.) add_header is all-or-nothing
    # per location, so the server-level security headers are repeated here.
    location = /index.html {
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location / {
#        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }
    location /static/ {
        alias /data/static/;
    }

    location /media/ {
        alias /data/media/;
    }

}
